plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pheeeew'
version = '0.0.1-SNAPSHOT'
description = 'Pheeeew backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.hibernate.orm:hibernate-spatial'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'io.github.moduggagi:korean-nickname-generator:0.1.1'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'org.postgresql:postgresql'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly platform('me.paulschwarz:spring-dotenv-bom:5.1.0')
    developmentOnly 'me.paulschwarz:springboot4-dotenv'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'e001'
    }
}

[
        e001LocationDistribution: 'e001-distribution',
        e001LocationPerformance : 'e001-performance',
        e001BlindReview         : 'e001-blind'
].each { taskName, experimentTag ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = "Opt-in E001 ${experimentTag} runner"
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags experimentTag
        }
        maxParallelForks = 1
        maxHeapSize = '1g'
        systemProperty 'java.awt.headless', 'true'
        systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
        systemProperty 'e001.projectDir', projectDir.absolutePath
        systemProperty 'e001.reportsDir', layout.buildDirectory.dir('reports/experiments').get().asFile.absolutePath
        systemProperty 'e001.gradleVersion', gradle.gradleVersion
        systemProperty 'e001.invalidationReason', providers.gradleProperty('e001InvalidationReason').getOrElse('')
    }
}
