plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pheeeew'
version = '0.0.1-SNAPSHOT'
description = 'Pheeeew backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':observability')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.hibernate.orm:hibernate-spatial'
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.7'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-cbor'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'io.github.moduggagi:korean-nickname-generator:0.1.1'
    implementation platform('software.amazon.awssdk:bom:2.55.6')
    implementation 'software.amazon.awssdk:s3'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.7:jpa'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    runtimeOnly 'org.postgresql:postgresql'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly platform('me.paulschwarz:spring-dotenv-bom:5.1.0')
    developmentOnly 'me.paulschwarz:springboot4-dotenv'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'pheeeew.rate-limit.emotion-create.enabled', 'false'

    // 테스트 결과는 빌드 캐시에 넣지 않는다. 같은 커밋을 다시 돌리는 이유는 보통
    // 플레이키를 다시 확인하려는 것이고, 캐시가 적중하면 테스트가 돌지 않는다.
    outputs.cacheIf { false }

    // 테스트를 여러 러너로 쪼갠다. -PtestShards=5 -PtestShard=0 처럼 넘긴다.
    // 넘기지 않으면 한 러너가 전부 도는 기존 동작과 같다.
    int shardCount = (project.findProperty('testShards') ?: '1') as int
    int shardIndex = (project.findProperty('testShard') ?: '0') as int
    if (shardCount > 1) {
        if (shardIndex < 0 || shardIndex >= shardCount) {
            throw new GradleException("testShard 는 0 이상 ${shardCount} 미만이어야 한다: ${shardIndex}")
        }
        // 샤드가 바뀌면 같은 작업 공간에서도 UP-TO-DATE 로 건너뛰지 않게 입력으로 등록한다.
        inputs.property('testShards', shardCount)
        inputs.property('testShard', shardIndex)
        // 경로는 설정 단계에서 정한다. 실행 단계의 project 접근은 설정 캐시와 맞지 않는다.
        File hint = file('ci-test-weights.properties')
        // 분배는 실행 시점에 컴파일된 테스트 클래스 목록을 보고 결정한다.
        doFirst {
            Properties weights = new Properties()
            if (hint.exists()) {
                hint.withInputStream { weights.load(it) }
            }
            // 테스트가 아닌 지원 클래스도 포함 목록에 넣어야 명명 규칙이 바뀌어도 빠지지 않는다.
            // 다만 균형 계산은 왜곡하지 않도록 가중치를 0 으로 둔다.
            Closure<Long> weightOf = { String name ->
                String recorded = weights.getProperty(name)
                if (recorded != null) {
                    return recorded as long
                }
                return name.endsWith('Test') ? 1000L : 0L
            }
            List<String> classNames = []
            testClassesDirs.asFileTree.matching { include '**/*.class' }.visit { details ->
                // 중첩 클래스는 바깥 클래스와 같은 샤드에 붙이므로 배정 단위에서 뺀다.
                if (details.file.isFile() && !details.path.contains('$')) {
                    classNames.add(details.path[0..-7].replace('/', '.'))
                }
            }
            if (classNames.isEmpty()) {
                throw new GradleException('컴파일된 테스트 클래스를 찾지 못했다.')
            }
            // 긴 작업 우선(LPT): 느린 클래스를 먼저 가장 한가한 샤드에 넣는다.
            classNames.sort { String a, String b ->
                weightOf(b) <=> weightOf(a) ?: (a <=> b)
            }
            long[] load = new long[shardCount]
            List<String> mine = []
            classNames.each { String name ->
                long weight = weightOf(name)
                int target = 0
                for (int i = 1; i < shardCount; i++) {
                    if (load[i] < load[target]) {
                        target = i
                    }
                }
                load[target] += weight
                if (target == shardIndex) {
                    String path = name.replace('.', '/')
                    mine.add(path + '.class')
                    // 정적 중첩 테스트 클래스도 바깥 클래스의 샤드에서 돈다. @Nested 는 바깥 클래스로만 실행된다.
                    mine.add(path + '$*.class')
                }
            }
            if (mine.isEmpty()) {
                throw new GradleException("샤드 ${shardIndex} 에 배정된 클래스가 없다. 분배 기준을 확인한다.")
            }
            logger.lifecycle("테스트 샤드 ${shardIndex}/${shardCount}: 클래스 ${mine.size().intdiv(2)}개, 가중치 합 ${load[shardIndex]}ms")
            setIncludes(mine)
        }
    }
}
