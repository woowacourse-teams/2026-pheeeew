# api-dev 의 직접 HTTPS 연결과 ALB 경유 HTTP 연결을 함께 받는다.
# 직접 연결에서는 전달 헤더를 믿지 않고, ALB 경로에서만 X-Forwarded-For의 마지막 주소를 쓴다.
# CF-Connecting-IP는 API 경로에서 믿지 않는다.

# real-IP 교체 전 TCP 연결 주소로 ALB 경로를 구분한다.
geo $realip_remote_addr $from_alb_subnet {
    default       0;
    10.0.10.0/24  1; # project-lb-a
    10.0.11.0/24  1; # project-lb-b
}

# 기기 등록과 challenge 발급은 인증 없이 열려 있고, 등록은 무결성 증명 토큰을 받으면
# 구글 복호화 API 를 호출해 일일 할당량을 소모한다. 키가 빈 요청은 계산에 넣지 않으므로
# 아래 두 경로 외에는 제한이 적용되지 않는다.
map "$request_method $uri" $device_write_key {
    default                           "";
    "POST /api/v2/devices"            $remote_addr;
    "POST /api/v2/devices/challenge"  $remote_addr;
}

limit_req_zone $device_write_key zone=device_write:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name docs-dev.pheeeew.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name api-dev.pheeeew.com;

    set_real_ip_from 10.0.10.0/24;
    set_real_ip_from 10.0.11.0/24;
    real_ip_header X-Forwarded-For;
    # ALB의 Append 모드가 마지막에 추가한 실제 클라이언트 주소만 쓴다.
    real_ip_recursive off;

    if ($from_alb_subnet = 0) {
        return 301 https://$host$request_uri;
    }
    if ($http_x_forwarded_proto != https) {
        return 400;
    }

    client_max_body_size 10M;

    location ~ "(^/actuator(?:/|$)|;)" {
        return 404;
    }
    location ~ "^/(swagger-ui|v3/api-docs|swagger-resources|webjars)(?:/|$|\.html)" {
        return 404;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        limit_req zone=device_write burst=10 nodelay;
        include /etc/nginx/upstream/active.conf;
        add_header X-Upstream $upstream_app always;
        proxy_pass http://$upstream_app:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Forwarded         "";
        proxy_set_header CF-Connecting-IP  "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api-dev.pheeeew.com;

    ssl_certificate     /etc/letsencrypt/live/api-dev.pheeeew.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-dev.pheeeew.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    # 사용하지 않는 세미콜론 경로 매개변수를 차단해 Tomcat 경로 해석을 통한 Actuator 우회를 방지한다.
    location ~ "(^/actuator(?:/|$)|;)" {
        return 404;
    }

    # API 문서는 Cloudflare Access 뒤의 docs-dev 에서만 연다.
    location ~ "^/(swagger-ui|v3/api-docs|swagger-resources|webjars)(?:/|$|\.html)" {
        return 404;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        limit_req zone=device_write burst=10 nodelay;
        include /etc/nginx/upstream/active.conf;
        add_header X-Upstream $upstream_app always;
        proxy_pass http://$upstream_app:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# API 문서용 주소. Cloudflare 프록시와 Access 를 거친 요청만 받는다.
# Cloudflare 가 제시하는 클라이언트 인증서를 확인한 연결이므로 이 주소에서만 CF-Connecting-IP 를
# 요청자 주소로 쓴다. 대역 목록은 https://www.cloudflare.com/ips/ 를 따른다.
server {
    listen 443 ssl;
    http2 on;
    server_name docs-dev.pheeeew.com;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    location ~ "(^/actuator(?:/|$)|;)" {
        return 404;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        limit_req zone=device_write burst=10 nodelay;
        include /etc/nginx/upstream/active.conf;
        add_header X-Upstream $upstream_app always;
        proxy_pass http://$upstream_app:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ALB 상태 검사의 IP Host를 받는다. LB 서브넷 제한과 함께 EC2 보안 그룹도 project-lb로 제한해야 한다.
    location = /actuator/health {
        allow 10.0.10.0/24; # project-lb-a
        allow 10.0.11.0/24; # project-lb-b
        deny all;

        if ($request_method != GET) {
            return 405;
        }

        include /etc/nginx/upstream/active.conf;
        proxy_pass http://$upstream_app:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host app;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        return 444;
    }
}
