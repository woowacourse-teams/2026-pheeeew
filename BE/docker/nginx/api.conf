# 기기 등록과 challenge 발급은 인증 없이 열려 있고, 등록은 무결성 증명 토큰을 받으면
# 구글 복호화 API 를 호출해 일일 할당량을 소모한다. 키가 빈 요청은 계산에 넣지 않으므로
# 아래 두 경로 외에는 제한이 적용되지 않는다.
map "$request_method $uri" $device_write_key {
    default                           "";
    "POST /api/v2/devices"            $http_cf_connecting_ip;
    "POST /api/v2/devices/challenge"  $http_cf_connecting_ip;
}

limit_req_zone $device_write_key zone=device_write:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name api.pheeeew.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.pheeeew.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    # 사용하지 않는 세미콜론 경로 매개변수를 차단해 Tomcat 경로 해석을 통한 Actuator 우회를 방지한다.
    location ~ "(^/actuator(?:/|$)|;)" {
        return 404;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        limit_req zone=device_write burst=10 nodelay;
        set $upstream_app app;
        proxy_pass http://$upstream_app:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    return 444;
}
