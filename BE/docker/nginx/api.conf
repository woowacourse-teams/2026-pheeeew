# api 는 Cloudflare 를 거치지 않고 직접 받는다. 요청자 주소는 연결 주소만 쓰고
# CF-Connecting-IP 헤더는 어디서 온 요청이든 믿지 않는다. Cloudflare 대역에서 온 연결이라도
# Cloudflare Workers 가 이 헤더를 임의로 넣을 수 있어 요청 제한을 우회할 수 있기 때문이다.

# 기기 등록과 challenge 발급은 인증 없이 열려 있고, 등록은 무결성 증명 토큰을 받으면
# 구글 복호화 API 를 호출해 일일 할당량을 소모한다. 키가 빈 요청은 계산에 넣지 않으므로
# 아래 경로들 외에는 제한이 적용되지 않는다.
# 그룹 참여는 6자리 초대 코드를 받으므로 무작위 대입을 막기 위해 함께 제한한다.
map "$request_method $uri" $device_write_key {
    default                           "";
    "POST /api/v2/devices"            $remote_addr;
    "POST /api/v2/devices/challenge"  $remote_addr;
    "POST /api/v2/groups/join"        $remote_addr;
}

limit_req_zone $device_write_key zone=device_write:10m rate=20r/m;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.pheeeew.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.pheeeew.com;

    ssl_certificate     /etc/letsencrypt/live/api.pheeeew.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pheeeew.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    # 사용하지 않는 세미콜론 경로 매개변수를 차단해 Tomcat 경로 해석을 통한 Actuator 우회를 방지한다.
    location ~ "(^/actuator(?:/|$)|;)" {
        return 404;
    }

    location ~ "^/(swagger-ui|v3/api-docs|swagger-resources|webjars)(?:/|$|\.html)" {
        return 404;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        limit_req zone=device_write burst=10 nodelay;
        set $upstream_app app;
        proxy_pass http://$upstream_app:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    return 444;
}
