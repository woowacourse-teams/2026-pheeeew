spring:
  application:
    name: pheeeew
  profiles:
    default: local
  config:
    import: classpath:application-log.yml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  servlet:
    multipart:
      # multipart 를 받는 API 가 없다. 켜 두면 경계가 없거나 크기를 넘는 multipart 요청이 500 과 오류 로그가 된다.
      enabled: false
  mvc:
    formcontent:
      filter:
        # 폼 본문을 받는 API 가 없다. 켜 두면 PUT, PATCH, DELETE 의 깨진 폼 본문이 필터에서 예외가 된다.
        enabled: false

pheeeew:
  climb:
    # 피유 등반(climb 모듈) 전체 스위치. 꺼져 있으면 climb 의 빈이 하나도 올라오지 않는다.
    enabled: false
    # 게임 주소 하나. 켤 때 반드시 정한다.
    allowed-origin:
    guest-creates-per-hour: 10
    # 관리자 모드 키. 비어 있으면 관리자 끝점이 모두 404 다. 값은 환경 변수로만 넣는다.
    admin-key: ${PHEEEEW_CLIMB_ADMIN_KEY:}
    # 맵 버전별 꼭대기 높이(칸), 구간 경계, 완주 최소 시간(초). 여기 없는 맵 버전은 순위에 넣지 않는다.
    maps:
      v1:
        top: 663
        zones: [135, 261, 397, 523, 653]
        min-finish-seconds: 300
  emotion-map:
    max-page-size: 200
  rate-limit:
    emotion-create:
      enabled: true
  s3:
    bucket: ${S3_BUCKET:}
    key-prefix: ${S3_KEY_PREFIX:}
    region: ${S3_REGION:}
  jwt:
    private-key-base64: ${JWT_PRIVATE_KEY_BASE64}
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64}
  token:
    access-ttl: PT30M
    registration-retry-window: PT5M
    challenge-ttl: PT5M
  play-integrity:
    android-package-name: com.pheeeew
    service-account-base64: ${PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64:}
    cloud-project-number: ${PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER:}
    # 무결성 증명 강제 스위치. 앱(#261) 배포가 끝난 뒤에만 켠다.
    # 켠 상태를 되돌릴 수 없게 만들려면 PlayIntegrityProperties.ENFORCEMENT_LOCKED 를 함께 true 로 바꾼다.
    require-attestation: false
    # 개발, QA 우회 스위치. 에뮬레이터와 디버그 빌드는 Play Integrity 판정에서 떨어지므로 그때만 켠다.
    # 기본값은 검증 활성이고, prod 프로필에서는 PlayIntegrityProductionGuard 가 부팅을 막는다.
    skip-verification: ${PLAY_INTEGRITY_SKIP_VERIFICATION:false}
    # 프로젝트 단위 구글 호출 일일 예산. 구글 무료 티어 10,000건보다 낮게 두어 여유를 남긴다.
    # UTC 자정 기준 고정 창이라 구글의 창과 어긋나도 두 창에 걸쳐 최대 2배까지만 나가므로 5,000을 넘기지 않는다.
    daily-call-budget: ${PLAY_INTEGRITY_DAILY_CALL_BUDGET:3000}
  fcm:
    project-id: pheeeew-8bf12
    service-account-base64: ${FCM_SERVICE_ACCOUNT_BASE64:}

  app-attest:
    # App ID 는 {Team ID}.{Bundle ID} 다. 예전에 만든 App ID 는 prefix 가 Team ID 와 다를 수 있고,
    # 그때는 Team ID 가 아니라 App ID prefix 를 넣어야 한다.
    # 여기 적은 prefix 중 하나와 맞으면 통과한다. 개발자 계정 이전으로 두 계정의 빌드가 함께 쓰이는 동안
    # 둘을 모두 허용한다. 이전 계정 빌드 지원을 끝내면 Z6V4SXKRL6 을 지운다.
    team-ids:
      - Z6V4SXKRL6
      - WKN466N42M
    bundle-id: com.itda.pheeeew
    # 실기기 개발 빌드는 DEVELOPMENT, TestFlight 와 App Store 빌드는 PRODUCTION 이다.
    # 둘은 배타적이라 한쪽만 통과한다. 개발 프로필이 DEVELOPMENT 로 재정의한다.
    environment: PRODUCTION
    # 무결성 증명 강제 스위치. 안드로이드와 따로 둔다. iOS 앱 배포가 끝난 뒤에만 켠다.
    # 켠 상태를 되돌릴 수 없게 만들려면 AppAttestProperties.ENFORCEMENT_LOCKED 를 함께 true 로 바꾼다.
    require-attestation: false

server:
  compression:
    # RegionMapCompressionConfiguration이 지역 요약 GET의 길이를 확정하고 정상 응답만 압축한다.
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

management:
  prometheus:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
