spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  forward-headers-strategy: native
  tomcat:
    mbeanregistry:
      # 톰캣 스레드 지표는 MBean 레지스트리가 켜져 있어야 등록된다.
      enabled: true

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      environment: dev
    distribution:
      # 시계열 수를 제한하기 위한 버킷 경계이며, 확정된 서비스 SLO는 아니다.
      slo:
        "[http.server.requests]": 50ms,100ms,250ms,500ms,1s,2s,5s
        "[spring.data.repository.invocations]": 50ms,100ms,200ms,500ms,1s,3s

pheeeew:
  app-attest:
    # 개발 서버는 Xcode 실기기 개발 빌드로 테스트한다.
    # TestFlight 빌드로 바꾸면 PRODUCTION 으로 고쳐야 한다.
    environment: DEVELOPMENT
