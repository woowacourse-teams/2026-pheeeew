# 테스트 샤드 균형용 가중치(밀리초). 로컬 전체 실행 1회에서 뽑았다.
# 여기 없는 클래스는 기본 가중치 1000ms 로 계산한다. 값이 낡으면 균형만 나빠지고 결과는 바뀌지 않는다.
# AppConfigServiceIntegrationTest 는 제외했다. 그 클래스의 32초는 자기 비용이 아니라
# 제일 먼저 도는 클래스가 떠안는 PostGIS 컨테이너 기동 + Flyway 44개 비용이고, 샤드마다 어차피 한 번씩 낸다.
# 다시 뽑는 법: ./gradlew test 뒤 build/test-results/test/*.xml 의 testsuite time 을 읽는다.

