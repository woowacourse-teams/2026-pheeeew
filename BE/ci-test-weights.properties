# 테스트 샤드 균형용 가중치(밀리초). CI 런 41956126624 의 1차·3차 시도 샤드 리포트에서 클래스 시간을 뽑아 평균했다.
# 여기 없는 클래스는 기본 가중치 1000ms 로 계산한다. 값이 낡으면 균형만 나빠지고 결과는 바뀌지 않는다.
# 로컬 시간은 쓰지 않는다. 클래스마다 CI/로컬 비율이 달라 로컬 값으로는 샤드 간 차이가 16~22초 났다.
# 샤드마다 처음 컨테이너를 쓰는 클래스가 PostGIS 기동 + Flyway 비용(약 16~20초)을 떠안는다. 샤드마다 한 번씩
# 어차피 내는 비용이므로, 로컬 대비 초과가 가장 큰 클래스를 그 클래스로 보고 로컬 시간 x CI/로컬 비율로 바꿔 넣었다.
# PR CI 는 대상 브랜치와 합친 머지 커밋을 돌리므로, 다시 뽑을 때도 CI 리포트(test-results-shard-*)를 쓴다.

