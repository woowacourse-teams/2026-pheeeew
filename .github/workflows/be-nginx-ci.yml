name: BE Nginx CI

on:
  pull_request:
    branches: [main, be/dev, develop]
    paths:
      - 'BE/docker/nginx/**'
      - 'BE/docker/compose.nginx.dev.yml'
      - 'BE/docker/compose.dev.yml'
      - 'BE/docker/test-deploy-switch.py'
      - 'BE/docker/press-generation.py'
      - 'BE/docker/test-press-generation.py'
      - 'BE/docker/press-operations.py'
      - 'BE/docker/press-prod-bootstrap.py'
      - 'BE/docker/test-prod-bootstrap.py'
      - 'BE/docker/press-prod-deploy-guard.sh'
      - 'BE/docker/test-prod-deploy-guard.py'
      - 'BE/docker/press-prod-lock.py'
      - 'BE/docker/test-prod-lock.py'
      - 'BE/docker/press-prod-deploy.sh'
      - 'BE/docker/test-prod-deploy-contract.py'
      - 'BE/docker/test-prod-route.py'
      - 'BE/docker/press-prod-manifest.py'
      - 'BE/docker/test-prod-manifest.py'
      - 'BE/docker/test-prod-workflow.py'
      - 'BE/docker/press-prod-preflight.py'
      - 'BE/docker/test-prod-preflight.py'
      - 'BE/docker/test-prod-monitoring.py'
      - 'BE/docker/test-prod-owner-postgres.py'
      - 'BE/docker/compose.monitoring.prod-bluegreen.yml'
      - 'BE/docker/alloy/config.prod-bluegreen.alloy'
      - 'BE/docker/compose.prod-bluegreen.yml'
      - 'BE/docker/compose.nginx.prod-bluegreen.yml'
      - 'BE/docker/nginx/api-prod-bluegreen.conf'
      - 'BE/docker/Dockerfile'
      - '.github/workflows/be-dev-deploy.yml'
      - '.github/workflows/be-deploy.yml'
      - '.github/workflows/be-nginx-ci.yml'

permissions:
  contents: read

jobs:
  nginx-prod-ws:
    name: 운영 Nginx ALB·WebSocket 검사
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 운영 ALB 상태 검사와 WebSocket 전달 검증
        working-directory: BE
        run: |
          python3 docker/nginx/test-prod-ws.py
          python3 docker/nginx/test-prod-ws.py --bluegreen

  nginx-health:
    name: 개발 Nginx ALB 상태 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Nginx 접근 제어 및 장애 응답 검증
        working-directory: BE
        run: python3 docker/nginx/test-alb-health.py

  deploy-switch:
    name: 개발 배포 전환과 복구 검사
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 전환과 롤백 분기 검증
        run: |
          pip install --quiet pyyaml
          python3 BE/docker/test-press-generation.py
          python3 BE/docker/test-prod-bootstrap.py
          python3 BE/docker/test-prod-deploy-guard.py
          python3 BE/docker/test-prod-lock.py
          python3 BE/docker/test-prod-route.py
          python3 BE/docker/test-prod-manifest.py
          python3 BE/docker/test-prod-workflow.py
          python3 BE/docker/test-prod-preflight.py
          python3 BE/docker/test-prod-monitoring.py
          python3 BE/docker/test-prod-owner-postgres.py
          python3 BE/docker/test-prod-deploy-contract.py
          python3 BE/docker/test-deploy-switch.py --ci

  press-proxy:
    name: 실제 Spring 프레스 운영 전환 검사
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 로컬 검증용 앱 이미지 빌드
        run: docker build -t pheeeew-press-operations-test -f BE/docker/Dockerfile BE

      - name: 인증 WS와 PostgreSQL·nginx 전환 검증
        working-directory: BE
        env:
          PHEEEEW_PRESS_OPERATIONS_IMAGE: pheeeew-press-operations-test
        # 재시작 후 HTTP timeout을 포함한 별도 시나리오는 보류 중이다.
        run: ./gradlew :test --tests '*PressOperationsProxyIntegrationTest.정상_ON_배포는*' --no-daemon

      - name: 프레스 운영 전환 테스트 리포트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: press-proxy-results
          path: BE/build/reports/tests/test
          retention-days: 7
