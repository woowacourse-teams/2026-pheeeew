name: BE Nginx CI

on:
  pull_request:
    branches: [main, be/dev, develop]
    paths:
      - 'BE/docker/nginx/**'
      - 'BE/docker/compose.nginx.dev.yml'
      - 'BE/docker/compose.dev.yml'
      - 'BE/docker/compose.nginx.yml'
      - 'BE/docker/compose.prod.yml'
      - 'BE/docker/compose.monitoring.yml'
      - 'BE/docker/compose.monitoring.dev.yml'
      - 'BE/docker/alloy/config.alloy'
      - 'BE/docker/alloy/config.dev.alloy'
      - 'BE/docker/alloy/verify.py'
      - '.github/workflows/be-deploy.yml'
      - 'BE/docker/test-deploy-switch.py'
      - '.github/workflows/be-dev-deploy.yml'
      - '.github/workflows/be-nginx-ci.yml'

permissions:
  contents: read

jobs:
  monitoring:
    name: 개발·운영 Alloy 설정 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 두 색 지표·로그 라벨과 필터 검증
        run: python3 BE/docker/alloy/verify.py

  nginx-health:
    name: 개발 Nginx ALB 상태 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Nginx 접근 제어 및 장애 응답 검증
        working-directory: BE
        run: python3 docker/nginx/test-alb-health.py

  deploy-switch:
    name: 배포 전환과 복구 검사
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [dev, prod]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 전환과 롤백 분기 검증
        env:
          DEPLOY_TARGET: ${{ matrix.target }}
        run: |
          pip install --quiet pyyaml
          python3 BE/docker/test-deploy-switch.py
