name: BE CI

on:
  pull_request:
    branches: [main, be/dev, develop]
    paths:
      - 'BE/**'
      # 문서만 바꾼 PR 은 테스트와 이미지 빌드를 돌리지 않는다. 뒤 패턴이 앞 패턴을 덮는다.
      # 코드와 문서를 함께 바꾸면 코드 쪽이 'BE/**' 에 걸려 그대로 실행된다.
      - '!BE/docs/**'
      - '!BE/**/*.md'
      - '.github/workflows/be-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # [실험] 캐시가 Gradle 9.1.0 기준으로 굳어 있어 9.5.1 이 매번 배포본을 내려받고
      # 계측 jar 를 다시 만든다. PR 스코프에 9.5.1 캐시를 써서 효과를 측정한다.
      # 운영 해법은 main push 로 캐시를 다시 심는 것이며 이 설정은 실험용이다.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 테스트
        run: ./gradlew test --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            BE/build/reports/tests/test
            BE/observability/build/reports/tests/test
          retention-days: 7

  docker-build:
    name: Docker 이미지 빌드 검증
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: 빌드만 (푸시하지 않음)
        uses: docker/build-push-action@v6
        with:
          context: BE
          file: BE/docker/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
