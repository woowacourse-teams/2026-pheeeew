# 실험: 5샤드
name: BE CI

on:
  # push 런이 Gradle 캐시를 심고 PR 런은 base 브랜치 캐시를 읽는다. 이 트리거가 없으면 아무도
  # 캐시를 갱신하지 않아 래퍼가 올라간 뒤에도 모든 PR 이 옛 버전 캐시를 영구히 읽는다.
  # 측정: 고정비 41.6초 -> 15.3초. BE PR 대부분이 be/dev 로 가므로 be/dev 에도 심는다.
  # develop 은 BE 변경이 be/dev 머지로만 들어오고 그 PR 은 main 캐시로 충분해 넣지 않는다.
  push:
    branches: [main, be/dev]
    paths:
      - 'BE/**'
      - '.github/workflows/be-ci.yml'
  pull_request:
    branches: [main, be/dev, develop]
    paths:
      - 'BE/**'
      # 문서만 바꾼 PR 은 테스트와 이미지 빌드를 돌리지 않는다. 뒤 패턴이 앞 패턴을 덮는다.
      # 코드와 문서를 함께 바꾸면 코드 쪽이 'BE/**' 에 걸려 그대로 실행된다.
      - '!BE/docs/**'
      - '!BE/**/*.md'
      - '.github/workflows/be-ci.yml'

permissions:
  contents: read

jobs:
  test:
    # push 런은 컴파일만 해서 캐시를 심는다. 같은 SHA 에 PR 런과 함께 붙어도 구분되게 이름을 나눈다.
    # setup-gradle 캐시 키는 표시 이름이 아니라 잡 ID(test)와 워크플로 이름·matrix 해시로 만든다.
    name: ${{ github.event_name == 'push' && 'BE 캐시 준비' || 'BE 테스트' }} (${{ matrix.order }}/5)
    runs-on: ubuntu-latest
    strategy:
      # 한 샤드가 깨져도 나머지 결과를 봐야 원인을 좁힐 수 있다.
      fail-fast: false
      # shard 는 Gradle 에 넘기는 0부터의 번호, order 는 잡 이름에 보이는 1부터의 번호다.
      matrix:
        include:
          - { shard: 0, order: 1 }
          - { shard: 1, order: 2 }
          - { shard: 2, order: 3 }
          - { shard: 3, order: 4 }
          - { shard: 4, order: 5 }
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # push 런(main, be/dev)만 캐시를 쓰고 PR 런은 읽기만 한다. 기본값은 기본 브랜치에서만
      # 쓰므로 be/dev push 가 캐시를 심으려면 직접 지정해야 한다.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: 테스트
        if: github.event_name == 'pull_request'
        # observability 테스트는 샤딩하지 않으므로 첫 샤드에서만 돌린다.
        run: ./gradlew ${{ matrix.shard == 0 && 'test' || ':test' }} --no-daemon -PtestShards=5 -PtestShard=${{ matrix.shard }}

      # push 런은 캐시만 심는다. 같은 트리를 머지 전 PR 런이 이미 테스트했고, be/dev 가 head 인
      # develop PR 이 열려 있으면 그 PR 런과 테스트가 겹친다. 잡 이름과 매트릭스를 그대로 둬야
      # 캐시 키가 PR 런의 같은 샤드와 맞는다.
      - name: 캐시 준비 (컴파일만)
        if: github.event_name == 'push'
        run: ./gradlew testClasses --no-daemon

      - name: 테스트 리포트 업로드
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: |
            BE/build/reports/tests/test
            BE/observability/build/reports/tests/test
          retention-days: 7

  docker-build:
    name: Docker 이미지 빌드 검증
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: 빌드만 (푸시하지 않음)
        uses: docker/build-push-action@v6
        with:
          context: BE
          file: BE/docker/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          # PR ref 캐시는 같은 PR 재실행에만 쓰여 저장소 한도(10GB)만 차지한다. push 런만 쓴다.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
