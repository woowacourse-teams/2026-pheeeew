name: BE CI

on:
  pull_request:
    branches: [main, be/dev, develop]
    paths:
      - 'BE/**'
      - '.github/workflows/be-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트
        run: ./gradlew test --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            BE/build/reports/tests/test
            BE/observability/build/reports/tests/test
          retention-days: 7

  docker-build:
    name: Docker 이미지 빌드 검증
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: 빌드만 (푸시하지 않음)
        uses: docker/build-push-action@v6
        with:
          context: BE
          file: BE/docker/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
