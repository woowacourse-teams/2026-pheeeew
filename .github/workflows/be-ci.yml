name: BE CI

on:
  # 기본 브랜치 push 가 Gradle 캐시를 심는다. gradle/actions 는 기본 브랜치 런에서만
  # 캐시를 쓰고 PR 런은 읽기 전용이다. 이 트리거가 없으면 아무도 캐시를 갱신하지 않아
  # 래퍼가 올라간 뒤에도 모든 PR 이 옛 버전 캐시를 영구히 읽는다. 측정: 고정비 41.6초 -> 15.3초.
  push:
    branches: [main]
    paths:
      - 'BE/**'
      - '.github/workflows/be-ci.yml'
  pull_request:
    branches: [main, be/dev, develop]
    paths:
      - 'BE/**'
      # 문서만 바꾼 PR 은 테스트와 이미지 빌드를 돌리지 않는다. 뒤 패턴이 앞 패턴을 덮는다.
      # 코드와 문서를 함께 바꾸면 코드 쪽이 'BE/**' 에 걸려 그대로 실행된다.
      - '!BE/docs/**'
      - '!BE/**/*.md'
      - '.github/workflows/be-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: 테스트 샤드 ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      # 한 샤드가 깨져도 나머지 결과를 봐야 원인을 좁힐 수 있다.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 테스트 JVM 이 처음 DB 를 쓸 때 받던 PostGIS 이미지를 미리 받는다. 뒤의 Gradle 기동·컴파일과 겹쳐서 돈다.
      # Testcontainers 는 그대로 쓴다. 받는 중에 컨테이너를 요청하면 Docker 가 같은 이미지 pull 을 합쳐 기다린다.
      - name: PostGIS 이미지 미리 받기
        run: |
          (start=$(date +%s); docker pull -q postgis/postgis:17-3.5 > /dev/null 2>&1; echo "pull exit=$? $(( $(date +%s) - start ))s" > /tmp/postgis-pull.log) &

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 캐시 쓰기 권한은 기본 동작에 맡긴다. 기본 브랜치 push 런에서만 쓰고 PR 런은 읽기만 한다.
      # 샤드 넷이 같은 키를 두고 동시에 쓰는 문제도 이 기본값이 막아준다.
      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트
        run: ./gradlew test --no-daemon -PtestShards=4 -PtestShard=${{ matrix.shard }}

      - name: PostGIS 이미지 받기 결과
        if: always()
        run: cat /tmp/postgis-pull.log || echo "pull 미완료"

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: |
            BE/build/reports/tests/test
            BE/observability/build/reports/tests/test
          retention-days: 7

  docker-build:
    name: Docker 이미지 빌드 검증
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: 빌드만 (푸시하지 않음)
        uses: docker/build-push-action@v6
        with:
          context: BE
          file: BE/docker/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
