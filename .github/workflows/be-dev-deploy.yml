name: BE DEV CD

on:
  push:
    branches:
      - develop
    paths:
      - 'BE/**'
      - '.github/workflows/be-dev-deploy.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '되돌릴 이미지 태그 (예: dev-0e3c40ec...). 비우면 현재 커밋을 빌드합니다'
        required: false
        type: string

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 이미지 빌드 및 푸시
    if: github.event.inputs.image_tag == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: BE
          file: BE/docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_IMAGE }}:dev
            ${{ secrets.DOCKERHUB_IMAGE }}:dev-${{ github.sha }}
          build-args: |
            APP_RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 개발 서버 배포
    if: always() && needs.build.result != 'failure' && needs.build.result != 'cancelled'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: S3 Secrets 확인
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_KEY_PREFIX: ${{ secrets.S3_KEY_PREFIX }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          set -eu
          for key in S3_BUCKET S3_KEY_PREFIX S3_REGION; do
            value="${!key:-}"
            if [[ -z "$value" ]]; then
              echo "::error::development Secrets에 $key 값이 등록되어 있지 않거나 비어 있습니다."
              exit 1
            fi
            if [[ ! "$value" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
              echo "::error::development Secrets의 $key 값은 앞뒤 공백 없이 영문, 숫자, 점, 밑줄, 슬래시, 하이픈으로 지정해야 합니다."
              exit 1
            fi
          done

      - name: Alloy Secrets 확인 및 환경 파일 생성
        env:
          GRAFANA_METRICS_URL: ${{ secrets.GRAFANA_METRICS_URL }}
          GRAFANA_METRICS_USER: ${{ secrets.GRAFANA_METRICS_USER }}
          GRAFANA_LOGS_URL: ${{ secrets.GRAFANA_LOGS_URL }}
          GRAFANA_LOGS_USER: ${{ secrets.GRAFANA_LOGS_USER }}
          GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
        run: |
          set -eu
          keys=(GRAFANA_METRICS_URL GRAFANA_METRICS_USER GRAFANA_LOGS_URL GRAFANA_LOGS_USER GRAFANA_CLOUD_TOKEN)
          for key in "${keys[@]}"; do
            value="${!key:-}"
            if [[ -z "$value" ]]; then
              echo "::error::development Secrets에 $key 값이 필요합니다."
              exit 1
            fi
            if [[ "$value" =~ [[:space:]] || "$value" == *"'"* || "$value" == *'\'* ]]; then
              echo "::error::$key 값에 공백, 따옴표 또는 역슬래시가 포함되어 있습니다. 연결 값을 확인하세요."
              exit 1
            fi
          done

          python3 - <<'PYTHON'
          import os
          from urllib.parse import urlsplit

          approved_endpoints = {
              "GRAFANA_METRICS_URL": (
                  "prometheus-prod-49-prod-ap-northeast-0.grafana.net", "/api/prom/push"
              ),
              "GRAFANA_LOGS_URL": (
                  "logs-prod-030.grafana.net", "/loki/api/v1/push"
              ),
          }
          for key, (host, path) in approved_endpoints.items():
              value = os.environ[key]
              try:
                  url = urlsplit(value)
                  valid = (
                      url.scheme == "https"
                      and url.netloc == host
                      and url.path == path
                      and not url.query
                      and not url.fragment
                      and url.geturl() == value
                  )
              except ValueError:
                  valid = False
              if not valid:
                  raise SystemExit(f"::error::{key}는 승인된 Grafana Cloud HTTPS 전송 주소여야 합니다.")
          PYTHON

          umask 077
          for key in "${keys[@]}"; do
            printf "%s='%s'\n" "$key" "${!key}"
          done > "$RUNNER_TEMP/pheeeew-alloy.env"

      - name: cloudflared 설치
        env:
          CLOUDFLARED_VERSION: '2026.8.2'
          CLOUDFLARED_SHA256: 'fcfb02b575a52ca1af2e3267af4e1517bcdeb30ac48c834c69abaed3c0576ad2'
        run: |
          set -eu
          curl -fsSL -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  cloudflared" | sha256sum -c -
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: SSH 설정
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host target
            HostName $SSH_HOST
            User ubuntu
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ID --service-token-secret $CF_SECRET
          CFG
          chmod 600 ~/.ssh/config
          ssh -o ConnectTimeout=30 target 'echo 터널 연결 확인'

      - name: compose, nginx, Alloy 설정 전송
        run: |
          set -eu
          ssh -F ~/.ssh/config target 'mkdir -p /opt/pheeeew/nginx /opt/pheeeew/alloy'
          ssh -F ~/.ssh/config target 'set -eu; cd /opt/pheeeew; if [ -f compose.yml ]; then cp compose.yml compose.yml.prev; fi'
          scp -F ~/.ssh/config BE/docker/compose.dev.yml target:/opt/pheeeew/compose.yml
          scp -F ~/.ssh/config BE/docker/compose.nginx.dev.yml target:/opt/pheeeew/compose.nginx.yml
          scp -F ~/.ssh/config BE/docker/compose.postgres.dev.yml target:/opt/pheeeew/compose.postgres.yml
          scp -F ~/.ssh/config BE/docker/nginx/api-dev.conf target:/opt/pheeeew/nginx/api-dev.conf
          scp -F ~/.ssh/config BE/docker/compose.monitoring.dev.yml target:/opt/pheeeew/compose.monitoring.yml
          scp -F ~/.ssh/config BE/docker/alloy/config.dev.alloy target:/opt/pheeeew/alloy/

      - name: .env.alloy 갱신
        run: |
          set -eu
          scp -F ~/.ssh/config "$RUNNER_TEMP/pheeeew-alloy.env" target:/opt/pheeeew/.env.alloy.new
          ssh -F ~/.ssh/config target 'set -eu; cd /opt/pheeeew; chmod 600 .env.alloy.new; mv .env.alloy.new .env.alloy'

      - name: .env 갱신
        env:
          APP_IMAGE: ${{ secrets.DOCKERHUB_IMAGE }}:dev-${{ github.sha }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_PRIVATE_KEY_BASE64: ${{ secrets.JWT_PRIVATE_KEY_BASE64 }}
          JWT_PUBLIC_KEY_BASE64: ${{ secrets.JWT_PUBLIC_KEY_BASE64 }}
          PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64: ${{ secrets.PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64 }}
          PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ secrets.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_KEY_PREFIX: ${{ secrets.S3_KEY_PREFIX }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          set -eu
          umask 077
          {
            echo "APP_IMAGE=$APP_IMAGE"
            echo "DB_URL=$DB_URL"
            echo "DB_USERNAME=$DB_USERNAME"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "JWT_PRIVATE_KEY_BASE64=$JWT_PRIVATE_KEY_BASE64"
            echo "JWT_PUBLIC_KEY_BASE64=$JWT_PUBLIC_KEY_BASE64"
            echo "PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64=$PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64"
            echo "PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER=$PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER"
            printf '%s\n' "S3_BUCKET=$S3_BUCKET" "S3_KEY_PREFIX=$S3_KEY_PREFIX" "S3_REGION=$S3_REGION"
          } > env.tmp
          scp -F ~/.ssh/config env.tmp target:/opt/pheeeew/.env.new
          ssh -F ~/.ssh/config target 'set -eu; umask 077; cd /opt/pheeeew; [ -f .env ] && cp .env .env.prev && chmod 600 .env.prev || true; chmod 600 .env.new; mv .env.new .env'
          rm -f env.tmp

      - name: 배포 전 공유 자원 준비
        run: |
          set -eu
          ssh -F ~/.ssh/config target 'bash -s' <<'REMOTE'
          set -eu
          docker network inspect pheeeew-dev >/dev/null 2>&1 || docker network create pheeeew-dev

          mkdir -p /opt/pheeeew/nginx/upstream
          if [ ! -f /opt/pheeeew/nginx/upstream/active.conf ]; then
            printf 'set $upstream_app app-blue;\n' > /opt/pheeeew/nginx/upstream/active.conf
            echo "전환 파일을 새로 만들었습니다: app-blue"
          else
            echo "현재 전환 대상: $(sed -n 's/.*set \$upstream_app \([a-z-]*\);.*/\1/p' /opt/pheeeew/nginx/upstream/active.conf)"
          fi

          for color in blue green; do
            volume="pheeeew-dev_app-logs-$color"
            docker volume inspect "$volume" >/dev/null 2>&1 || docker volume create "$volume" >/dev/null
            docker run --rm -v "$volume:/logs" nginx:1.27-alpine \
              sh -c 'test -f /logs/application.json || : > /logs/application.json'
          done
          REMOTE

      - name: nginx 배포
        run: |
          set -eu
          ssh -F ~/.ssh/config target 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/pheeeew

          docker compose -f compose.nginx.yml up -d --wait --wait-timeout 60

          if ! docker compose -f compose.nginx.yml exec -T nginx nginx -t </dev/null; then
            echo "nginx 설정이 올바르지 않습니다. reload 를 건너뛰고 앱 배포도 하지 않습니다."
            echo "엣지는 메모리의 이전 설정으로 계속 동작하므로 서비스는 유지됩니다."
            exit 1
          fi

          docker compose -f compose.nginx.yml exec -T nginx nginx -s reload </dev/null
          echo "nginx 설정을 다시 읽었습니다."
          REMOTE

      - name: 배포
        env:
          IMAGE: ${{ secrets.DOCKERHUB_IMAGE }}:${{ github.event.inputs.image_tag || format('dev-{0}', github.sha) }}
        run: |
          set -eu
          ssh -F ~/.ssh/config target "APP_IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -eu
          cd /opt/pheeeew

          POINTER=nginx/upstream/active.conf
          BACKUP=nginx/upstream/active.conf.bak
          PROBE_HOST=api-dev.pheeeew.com
          PROBE_PATH="/api/v3/devices/nicknames/availability?nickname=probe"
          PROBE_URL="https://$PROBE_HOST$PROBE_PATH"
          NGINX="docker compose -f compose.nginx.yml"
          APPS="docker compose -f compose.yml"
          WORKER_MARK="[w]orker process is shutting down"

          if command -v python3 >/dev/null 2>&1; then
            JSON_TOOL=python3
          elif command -v jq >/dev/null 2>&1; then
            JSON_TOOL=jq
          else
            echo "JSON 검증 도구(python3, jq)가 없어 전환을 검증할 수 없습니다. 배포하지 않습니다."
            exit 1
          fi

          read_pointer() {
            sed -n 's/.*set \$upstream_app \([a-z-]*\);.*/\1/p' "$POINTER"
          }

          available_is_boolean() {
            if [ "$JSON_TOOL" = python3 ]; then
              python3 -c "import json, sys; body = json.load(open(sys.argv[1])); sys.exit(0 if isinstance(body, dict) and isinstance(body.get('available'), bool) else 1)" "$1" 2>/dev/null
            else
              jq -e 'type == "object" and has("available") and (.available | type) == "boolean"' "$1" >/dev/null 2>&1
            fi
          }

          served() {
            code=$(curl -sS --resolve "$PROBE_HOST:443:127.0.0.1" \
                        --connect-timeout 2 --max-time 5 \
                        -o /tmp/probe.body -D /tmp/probe.head \
                        -w '%{http_code}' "$PROBE_URL") || return 1
            [ "$code" = 200 ] || return 1
            available_is_boolean /tmp/probe.body || return 1
            sed -n 's/^[Xx]-[Uu]pstream:[[:space:]]*//p' /tmp/probe.head | tr -d '\r\n'
          }

          target_answers_api() {
            $NGINX exec -T nginx \
                 wget -q -O - "http://$TARGET:8080$PROBE_PATH" </dev/null >/tmp/target.body 2>/dev/null \
              || return 1
            available_is_boolean /tmp/target.body
          }

          wait_target_api() {
            deadline=$(($(date +%s) + 30))
            while :; do
              target_answers_api && return 0
              [ "$(date +%s)" -ge "$deadline" ] && break
              sleep 1
            done
            return 1
          }

          wait_served() {
            want=$1
            deadline=$(($(date +%s) + 30))
            got=
            while :; do
              got=$(served) || got=
              [ "$got" = "$want" ] && return 0
              [ "$(date +%s)" -ge "$deadline" ] && break
              sleep 1
            done
            echo "엣지가 $want 를 서비스하지 않습니다. 마지막 확인: ${got:-정상 응답 없음}"
            return 1
          }

          count_shutting_workers() {
            out=$($NGINX exec -T nginx \
                    sh -c "ps -o args= || exit 9; echo COUNTED" </dev/null 2>/dev/null) || return 1
            case "$out" in
              *COUNTED) ;;
              *) return 1 ;;
            esac
            printf '%s\n' "$out" | grep -c "$WORKER_MARK" || true
          }

          wait_drained() {
            deadline=$(($(date +%s) + 60))
            checked=no
            while :; do
              if left=$(count_shutting_workers); then
                case "$left" in
                  ''|*[!0-9]*) ;;
                  *)
                    checked=yes
                    [ "$left" -eq 0 ] && return 0 ;;
                esac
              fi
              [ "$(date +%s)" -ge "$deadline" ] && break
              sleep 1
            done
            [ "$checked" = yes ] \
              && echo "   제한 시간 안에 종료 중인 nginx 워커가 사라지지 않았습니다." \
              || echo "   nginx 워커 상태를 한 번도 확인하지 못했습니다."
            return 1
          }

          report_mismatch() {
            echo "!! 복구에 실패했습니다. 전환 파일과 실제 서비스가 어긋날 수 있습니다."
            echo "   전환 파일: $(read_pointer)"
            echo "   엣지 응답: $(served || echo '정상 응답 없음')"
            echo "   $ACTIVE 와 $TARGET 을 모두 남겨 둡니다. 수동 확인이 필요합니다."
          }

          restore_pointer() {
            [ -f "$BACKUP" ] || return 1
            cat "$BACKUP" > "$POINTER"
            rm -f "$BACKUP"
            $NGINX exec -T nginx nginx -t </dev/null || return 1
            $NGINX exec -T nginx nginx -s reload </dev/null || return 1
            wait_served "$ACTIVE"
          }

          rollback() {
            if ! restore_pointer; then
              report_mismatch
              return 1
            fi
            echo "$ACTIVE 로 복구했고 정상 응답을 확인했습니다."
            if wait_drained; then
              echo "$TARGET 으로 향하던 요청이 모두 끝났습니다."
            else
              echo "$TARGET 으로 향하던 요청이 끝났는지 확인하지 못했습니다."
            fi
            $APPS stop "$TARGET"
            $APPS rm -f "$TARGET"
            echo "$TARGET 을 정리했습니다."
          }

          ACTIVE=$(read_pointer)
          case "$ACTIVE" in
            app-blue|app-green) ;;
            *) echo "전환 파일의 값이 올바르지 않습니다: '${ACTIVE:-빈 값}'. 전환하지 않습니다."; exit 1 ;;
          esac
          [ "$ACTIVE" = app-blue ] && TARGET=app-green || TARGET=app-blue
          echo "현재 $ACTIVE, 새로 띄울 것 $TARGET"

          $APPS pull "$TARGET"

          if ! $APPS up -d --wait --wait-timeout 180 "$TARGET"; then
            echo "===== 새 버전 기동 실패 — 로그 ====="
            $APPS logs --tail=100 "$TARGET" 2>&1 | grep -a -v -F -e 'http_request_failed' -e 'scheduled_task_failed' || true
            $APPS rm -sf "$TARGET"
            echo "전환하지 않고 끝냅니다. 트래픽은 $ACTIVE 에 그대로 있습니다."
            exit 1
          fi

          if ! wait_target_api; then
            echo "새 버전이 최소 API 를 응답하지 않습니다."
            $APPS logs --tail=50 "$TARGET" 2>&1 | grep -a -v -F -e 'http_request_failed' -e 'scheduled_task_failed' || true
            $APPS rm -sf "$TARGET"
            echo "전환하지 않고 끝냅니다. 트래픽은 $ACTIVE 에 그대로 있습니다."
            exit 1
          fi
          echo "$TARGET 이 최소 API 를 응답합니다."

          cp "$POINTER" "$BACKUP"
          printf 'set $upstream_app %s;\n' "$TARGET" > "$POINTER"

          if ! $NGINX exec -T nginx nginx -t </dev/null; then
            echo "전환 설정이 올바르지 않습니다."
            cat "$BACKUP" > "$POINTER"
            rm -f "$BACKUP"
            $APPS rm -sf "$TARGET"
            echo "전환하지 않고 끝냅니다. 트래픽은 $ACTIVE 에 그대로 있습니다."
            exit 1
          fi

          if ! $NGINX exec -T nginx nginx -s reload </dev/null; then
            echo "reload 가 실패했습니다. 전환 파일을 되돌립니다."
            rollback || true
            exit 1
          fi

          if ! wait_served "$TARGET"; then
            echo "전환이 반영되지 않았습니다. 전환 파일을 되돌립니다."
            rollback || true
            exit 1
          fi
          echo "$TARGET 으로 전환했고 정상 응답을 확인했습니다."

          if wait_drained; then
            echo "이전 요청이 모두 끝났습니다."
          else
            echo "이전 요청이 끝났는지 확인하지 못했습니다. $ACTIVE 를 graceful 하게 내립니다."
            echo "   종료 유예 30초 안에서 앱이 남은 요청을 스스로 마무리합니다."
          fi
          rm -f "$BACKUP"

          $APPS stop "$ACTIVE"
          $APPS rm -f "$ACTIVE"

          echo "배포 성공: $APP_IMAGE ($TARGET)"
          docker image prune -f
          REMOTE

      - name: Alloy 배포
        run: |
          set -eu
          ssh -F ~/.ssh/config target 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/pheeeew
          chmod 600 .env.alloy
          docker compose --env-file .env.alloy -f compose.monitoring.yml config --quiet
          docker compose --env-file .env.alloy -f compose.monitoring.yml pull alloy
          docker compose --env-file .env.alloy -f compose.monitoring.yml run --rm --no-deps --interactive=false -T alloy validate /etc/alloy/config.alloy
          docker compose --env-file .env.alloy -f compose.monitoring.yml up -d --force-recreate --wait --wait-timeout 60
          REMOTE

      - name: Alloy 임시 환경 파일 삭제
        if: always()
        run: rm -f "$RUNNER_TEMP/pheeeew-alloy.env"
