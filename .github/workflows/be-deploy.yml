name: BE CD

on:
  push:
    branches:
      - main
    paths:
      - 'BE/**'
      - '.github/workflows/be-deploy.yml'
  workflow_dispatch:
    inputs:
      build_only:
        description: '운영 최초 이행을 위한 이미지 빌드만 실행'
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 이미지 빌드 및 푸시
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: BE
          file: BE/docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ !inputs.build_only && format('{0}:latest', secrets.DOCKERHUB_IMAGE) || '' }}
            ${{ secrets.DOCKERHUB_IMAGE }}:prod-${{ github.sha }}
          build-args: |
            APP_RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 운영 서버 배포
    needs: build
    if: ${{ !inputs.build_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: S3 Secrets 확인
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_KEY_PREFIX: ${{ secrets.S3_KEY_PREFIX }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          set -eu
          for key in S3_BUCKET S3_KEY_PREFIX S3_REGION; do
            value="${!key:-}"
            if [[ -z "$value" ]]; then
              echo "::error::production Secrets에 $key 값이 등록되어 있지 않거나 비어 있습니다."
              exit 1
            fi
            if [[ ! "$value" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
              echo "::error::production Secrets의 $key 값은 앞뒤 공백 없이 영문, 숫자, 점, 밑줄, 슬래시, 하이픈으로 지정해야 합니다."
              exit 1
            fi
          done

      - name: 무결성 증명 Secrets 확인
        env:
          PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64: ${{ secrets.PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64 }}
          PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ secrets.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
        run: |
          set -eu
          # 운영은 무결성 증명을 강제하므로 자격증명이 비면 앱이 부팅하지 못한다.
          # 부팅 실패와 롤백 대신 여기서 멈춰 원인을 분명히 남긴다.
          if [[ -z "${PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64:-}" ]]; then
            echo "::error::production Secrets에 PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64 값이 등록되어 있지 않거나 비어 있습니다."
            exit 1
          fi
          if [[ ! "${PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::production Secrets의 PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER 값은 숫자여야 합니다."
            exit 1
          fi

      - name: FCM Secrets 확인
        env:
          FCM_SERVICE_ACCOUNT_BASE64: ${{ secrets.FCM_SERVICE_ACCOUNT_BASE64 }}
        run: |
          set -eu
          if [[ -z "${FCM_SERVICE_ACCOUNT_BASE64:-}" ]]; then
            echo "::error::production Secrets에 FCM_SERVICE_ACCOUNT_BASE64 값이 등록되어 있지 않거나 비어 있습니다."
            exit 1
          fi

      - name: Alloy Secrets 확인 및 환경 파일 생성
        env:
          GRAFANA_METRICS_URL: ${{ secrets.GRAFANA_METRICS_URL }}
          GRAFANA_METRICS_USER: ${{ secrets.GRAFANA_METRICS_USER }}
          GRAFANA_LOGS_URL: ${{ secrets.GRAFANA_LOGS_URL }}
          GRAFANA_LOGS_USER: ${{ secrets.GRAFANA_LOGS_USER }}
          GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
        run: |
          set -eu
          keys=(GRAFANA_METRICS_URL GRAFANA_METRICS_USER GRAFANA_LOGS_URL GRAFANA_LOGS_USER GRAFANA_CLOUD_TOKEN)
          for key in "${keys[@]}"; do
            value="${!key:-}"
            if [[ -z "$value" ]]; then
              echo "::error::production Secrets에 $key 값이 필요합니다."
              exit 1
            fi
            if [[ "$value" =~ [[:space:]] || "$value" == *"'"* || "$value" == *'\'* ]]; then
              echo "::error::$key 값에 공백, 따옴표 또는 역슬래시가 포함되어 있습니다. 연결 값을 확인하세요."
              exit 1
            fi
          done

          python3 - <<'PYTHON'
          import os
          from urllib.parse import urlsplit

          approved_endpoints = {
              "GRAFANA_METRICS_URL": (
                  "prometheus-prod-49-prod-ap-northeast-0.grafana.net", "/api/prom/push"
              ),
              "GRAFANA_LOGS_URL": (
                  "logs-prod-030.grafana.net", "/loki/api/v1/push"
              ),
          }
          for key, (host, path) in approved_endpoints.items():
              value = os.environ[key]
              try:
                  url = urlsplit(value)
                  valid = (
                      url.scheme == "https"
                      and url.netloc == host
                      and url.path == path
                      and not url.query
                      and not url.fragment
                      and url.geturl() == value
                  )
              except ValueError:
                  valid = False
              if not valid:
                  raise SystemExit(f"::error::{key}는 승인된 Grafana Cloud HTTPS 전송 주소여야 합니다.")
          PYTHON

          umask 077
          for key in "${keys[@]}"; do
            printf "%s='%s'\n" "$key" "${!key}"
          done > "$RUNNER_TEMP/pheeeew-alloy.env"

      - name: cloudflared 설치
        env:
          CLOUDFLARED_VERSION: '2026.8.2'
          CLOUDFLARED_SHA256: 'fcfb02b575a52ca1af2e3267af4e1517bcdeb30ac48c834c69abaed3c0576ad2'
        run: |
          set -eu
          curl -fsSL -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  cloudflared" | sha256sum -c -
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: SSH 설정
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host target
            HostName $SSH_HOST
            User ubuntu
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ID --service-token-secret $CF_SECRET
          CFG
          chmod 600 ~/.ssh/config
          ssh -o ConnectTimeout=30 target 'echo 터널 연결 확인'

      - name: 운영 작업 잠금 획득
        id: operations-lock
        run: |
          set -eu
          token="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(cat /proc/sys/kernel/random/uuid)"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          ssh -F ~/.ssh/config target "python3 - acquire '$token'" < BE/docker/press-prod-lock.py

      - name: 운영 최초 이행 기록 확인
        env:
          LOCK_TOKEN: ${{ steps.operations-lock.outputs.token }}
        run: |
          set -eu
          status=0
          ssh -F ~/.ssh/config target 'bash -s -- /opt/pheeeew' < BE/docker/press-prod-deploy-guard.sh || status=$?
          if [ "$status" = 42 ]; then
            # The read-only guard finished and reported an existing journal.
            ssh -F ~/.ssh/config target "python3 - release '$LOCK_TOKEN'" < BE/docker/press-prod-lock.py
            exit 1
          fi
          if [ "$status" != 0 ]; then
            exit "$status"
          fi

      - name: 운영 프레스 계약 확인
        env:
          IMAGE: ${{ secrets.DOCKERHUB_IMAGE }}:prod-${{ github.sha }}
          LOCK_TOKEN: ${{ steps.operations-lock.outputs.token }}
        run: |
          set -eu
          case "$IMAGE" in *[!a-zA-Z0-9._:/@-]*) echo '이미지 이름이 올바르지 않습니다.' >&2; exit 1;; esac
          contract=$(ssh -F ~/.ssh/config target "APP_IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -eu
          docker pull "$APP_IMAGE" >&2
          docker image inspect --format '{{index .Config.Labels "com.pheeeew.press-generation-contract"}}' "$APP_IMAGE"
          REMOTE
          )
          if [ "$contract" != 2 ]; then
            ssh -F ~/.ssh/config target "python3 - release '$LOCK_TOKEN'" < BE/docker/press-prod-lock.py
            echo '운영 일반 배포에는 프레스 계약 2가 필요합니다.' >&2
            exit 1
          fi

      - name: 운영 blue green 설정 전송
        run: |
          set -eu
          ssh -F ~/.ssh/config target 'mkdir -p /opt/pheeeew/nginx/upstream /opt/pheeeew/alloy'
          scp -F ~/.ssh/config BE/docker/compose.prod-bluegreen.yml target:/opt/pheeeew/compose.yml.new
          scp -F ~/.ssh/config BE/docker/compose.nginx.prod-bluegreen.yml target:/opt/pheeeew/compose.nginx.yml.new
          scp -F ~/.ssh/config BE/docker/compose.monitoring.prod-bluegreen.yml target:/opt/pheeeew/compose.monitoring.yml.new
          scp -F ~/.ssh/config BE/docker/nginx/api-prod-bluegreen.conf target:/opt/pheeeew/nginx/api-bluegreen.conf.new
          scp -F ~/.ssh/config BE/docker/alloy/config.prod-bluegreen.alloy target:/opt/pheeeew/alloy/config.prod-bluegreen.alloy.new
          for file in press-generation.py press-operations.py press-prod-deploy.sh press-prod-deploy-guard.sh press-prod-lock.py press-prod-preflight.py; do
            scp -F ~/.ssh/config "BE/docker/$file" "target:/opt/pheeeew/$file.new"
          done
          ssh -F ~/.ssh/config target 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/pheeeew
          current=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.config-hash"}}' pheeeew-prod-nginx)
          desired=$(docker compose -f compose.nginx.yml.new config --hash nginx | awk '$1 == "nginx" { print $2 }')
          if [ -z "$current" ] || [ -z "$desired" ] || [ "$current" != "$desired" ]; then
            echo '운영 nginx 컨테이너 구성 변경은 별도의 교체 절차가 필요합니다.' >&2
            exit 1
          fi
          for file in compose.yml compose.nginx.yml compose.monitoring.yml alloy/config.prod-bluegreen.alloy press-generation.py press-operations.py press-prod-deploy.sh press-prod-deploy-guard.sh press-prod-lock.py press-prod-preflight.py; do
            mv "$file.new" "$file"
          done
          # Keep the existing bind-mounted inode so nginx can validate and reload the new config.
          cp nginx/api-bluegreen.conf nginx/api-bluegreen.conf.prev
          cat nginx/api-bluegreen.conf.new > nginx/api-bluegreen.conf
          if ! docker compose -f compose.nginx.yml exec -T nginx nginx -t </dev/null; then
            cat nginx/api-bluegreen.conf.prev > nginx/api-bluegreen.conf
            echo '운영 nginx 설정 검증 실패. 이전 설정을 복원했습니다.' >&2
            exit 1
          fi
          rm -f nginx/api-bluegreen.conf.new
          REMOTE

      - name: .env.alloy 갱신
        run: |
          set -eu
          scp -F ~/.ssh/config "$RUNNER_TEMP/pheeeew-alloy.env" target:/opt/pheeeew/.env.alloy.new
          ssh -F ~/.ssh/config target 'set -eu; cd /opt/pheeeew; chmod 600 .env.alloy.new; mv .env.alloy.new .env.alloy'

      - name: .env 갱신
        env:
          APP_IMAGE: ${{ secrets.DOCKERHUB_IMAGE }}:prod-${{ github.sha }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_PRIVATE_KEY_BASE64: ${{ secrets.JWT_PRIVATE_KEY_BASE64 }}
          JWT_PUBLIC_KEY_BASE64: ${{ secrets.JWT_PUBLIC_KEY_BASE64 }}
          PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64: ${{ secrets.PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64 }}
          PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ secrets.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
          FCM_SERVICE_ACCOUNT_BASE64: ${{ secrets.FCM_SERVICE_ACCOUNT_BASE64 }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_KEY_PREFIX: ${{ secrets.S3_KEY_PREFIX }}
          S3_REGION: ${{ secrets.S3_REGION }}
          COLLECTION_CARD_VERSION: ${{ secrets.COLLECTION_CARD_VERSION }}
        run: |
          set -eu
          umask 077
          {
            echo "APP_IMAGE=$APP_IMAGE"
            echo "DB_URL=$DB_URL"
            echo "DB_USERNAME=$DB_USERNAME"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "JWT_PRIVATE_KEY_BASE64=$JWT_PRIVATE_KEY_BASE64"
            echo "JWT_PUBLIC_KEY_BASE64=$JWT_PUBLIC_KEY_BASE64"
            echo "PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64=$PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64"
            echo "PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER=$PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER"
            echo "FCM_SERVICE_ACCOUNT_BASE64=$FCM_SERVICE_ACCOUNT_BASE64"
            printf '%s\n' "S3_BUCKET=$S3_BUCKET" "S3_KEY_PREFIX=$S3_KEY_PREFIX" "S3_REGION=$S3_REGION"
            printf '%s\n' "COLLECTION_CARD_VERSION=$COLLECTION_CARD_VERSION"
          } > env.tmp
          scp -F ~/.ssh/config env.tmp target:/opt/pheeeew/.env.new
          ssh -F ~/.ssh/config target 'set -eu; umask 077; cd /opt/pheeeew; [ -f .env ] && cp .env .env.prev && chmod 600 .env.prev || true; chmod 600 .env.new; mv .env.new .env'
          rm -f env.tmp

      - name: 운영 blue green 배포
        env:
          IMAGE: ${{ secrets.DOCKERHUB_IMAGE }}:prod-${{ github.sha }}
          LOCK_TOKEN: ${{ steps.operations-lock.outputs.token }}
        run: |
          set -eu
          case "$IMAGE" in *[!a-zA-Z0-9._:/@-]*) echo '이미지 이름이 올바르지 않습니다.' >&2; exit 1;; esac
          ssh -F ~/.ssh/config target "APP_IMAGE='$IMAGE' LOCK_TOKEN='$LOCK_TOKEN' sh /opt/pheeeew/press-prod-deploy.sh"

      - name: Alloy 배포
        run: |
          set -eu
          ssh -F ~/.ssh/config target 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/pheeeew
          chmod 600 .env.alloy
          docker compose --env-file .env.alloy -f compose.monitoring.yml config --quiet
          docker compose --env-file .env.alloy -f compose.monitoring.yml pull alloy
          docker compose --env-file .env.alloy -f compose.monitoring.yml run --rm --no-deps --interactive=false -T alloy validate /etc/alloy/config.alloy
          docker compose --env-file .env.alloy -f compose.monitoring.yml up -d --force-recreate --wait --wait-timeout 60
          REMOTE

      - name: 운영 배포 마무리
        run: |
          set -eu
          ssh -F ~/.ssh/config target 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/pheeeew
          TARGET_CONTAINER=$(python3 -c 'import json; print(json.load(open(".press-deploy.json"))["target_container"])')
          python3 press-generation.py finalize "$TARGET_CONTAINER"
          rm -f .press-deploy.json nginx/upstream/active.conf.bak
          REMOTE

      - name: 운영 작업 잠금 해제
        env:
          LOCK_TOKEN: ${{ steps.operations-lock.outputs.token }}
        run: |
          set -eu
          ssh -F ~/.ssh/config target "python3 - release '$LOCK_TOKEN'" < BE/docker/press-prod-lock.py

      - name: Alloy 임시 환경 파일 삭제
        if: always()
        run: rm -f "$RUNNER_TEMP/pheeeew-alloy.env"
