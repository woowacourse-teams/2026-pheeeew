name: BE CD

on:
  push:
    branches:
      - main
    paths:
      - 'BE/**'
      - '.github/workflows/be-deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 이미지 빌드 및 푸시
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: BE
          file: BE/docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_IMAGE }}:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 운영 서버 배포
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Alloy Secrets 확인 및 환경 파일 생성
        env:
          GRAFANA_METRICS_URL: ${{ secrets.GRAFANA_METRICS_URL }}
          GRAFANA_METRICS_USER: ${{ secrets.GRAFANA_METRICS_USER }}
          GRAFANA_LOGS_URL: ${{ secrets.GRAFANA_LOGS_URL }}
          GRAFANA_LOGS_USER: ${{ secrets.GRAFANA_LOGS_USER }}
          GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
        run: |
          set -eu
          keys=(GRAFANA_METRICS_URL GRAFANA_METRICS_USER GRAFANA_LOGS_URL GRAFANA_LOGS_USER GRAFANA_CLOUD_TOKEN)
          for key in "${keys[@]}"; do
            value="${!key:-}"
            if [[ -z "$value" ]]; then
              echo "::error::production Secrets에 $key 값이 필요합니다."
              exit 1
            fi
            if [[ "$value" =~ [[:space:]] || "$value" == *"'"* || "$value" == *'\'* ]]; then
              echo "::error::$key 값에 공백, 따옴표 또는 역슬래시가 포함되어 있습니다. 연결 값을 확인하세요."
              exit 1
            fi
          done

          python3 - <<'PYTHON'
          import os
          from urllib.parse import urlsplit

          approved_endpoints = {
              "GRAFANA_METRICS_URL": (
                  "prometheus-prod-49-prod-ap-northeast-0.grafana.net", "/api/prom/push"
              ),
              "GRAFANA_LOGS_URL": (
                  "logs-prod-030.grafana.net", "/loki/api/v1/push"
              ),
          }
          for key, (host, path) in approved_endpoints.items():
              value = os.environ[key]
              try:
                  url = urlsplit(value)
                  valid = (
                      url.scheme == "https"
                      and url.netloc == host
                      and url.path == path
                      and not url.query
                      and not url.fragment
                      and url.geturl() == value
                  )
              except ValueError:
                  valid = False
              if not valid:
                  raise SystemExit(f"::error::{key}는 승인된 Grafana Cloud HTTPS 전송 주소여야 합니다.")
          PYTHON

          umask 077
          for key in "${keys[@]}"; do
            printf "%s='%s'\n" "$key" "${!key}"
          done > "$RUNNER_TEMP/pheeeew-alloy.env"

      - name: cloudflared 설치
        env:
          CLOUDFLARED_VERSION: '2026.8.2'
          CLOUDFLARED_SHA256: 'fcfb02b575a52ca1af2e3267af4e1517bcdeb30ac48c834c69abaed3c0576ad2'
        run: |
          set -eu
          curl -fsSL -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  cloudflared" | sha256sum -c -
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: SSH 설정
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host target
            HostName $SSH_HOST
            User ubuntu
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ID --service-token-secret $CF_SECRET
          CFG
          chmod 600 ~/.ssh/config
          ssh -o ConnectTimeout=30 target 'echo 터널 연결 확인'

      - name: compose, nginx, Alloy 설정 전송
        run: |
          set -eu
          ssh -F ~/.ssh/config target 'mkdir -p /opt/pheeeew/nginx /opt/pheeeew/alloy'
          scp -F ~/.ssh/config BE/docker/compose.prod.yml target:/opt/pheeeew/compose.yml
          scp -F ~/.ssh/config BE/docker/nginx/api.conf target:/opt/pheeeew/nginx/api.conf
          scp -F ~/.ssh/config BE/docker/compose.monitoring.yml target:/opt/pheeeew/compose.monitoring.yml
          scp -F ~/.ssh/config BE/docker/alloy/config.alloy target:/opt/pheeeew/alloy/

      - name: .env.alloy 갱신
        run: |
          set -eu
          scp -F ~/.ssh/config "$RUNNER_TEMP/pheeeew-alloy.env" target:/opt/pheeeew/.env.alloy.new
          ssh -F ~/.ssh/config target 'set -eu; cd /opt/pheeeew; chmod 600 .env.alloy.new; mv .env.alloy.new .env.alloy'

      - name: .env 갱신
        env:
          APP_IMAGE: ${{ secrets.DOCKERHUB_IMAGE }}:prod-${{ github.sha }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_PRIVATE_KEY_BASE64: ${{ secrets.JWT_PRIVATE_KEY_BASE64 }}
          JWT_PUBLIC_KEY_BASE64: ${{ secrets.JWT_PUBLIC_KEY_BASE64 }}
        run: |
          set -eu
          umask 077
          {
            echo "APP_IMAGE=$APP_IMAGE"
            echo "DB_URL=$DB_URL"
            echo "DB_USERNAME=$DB_USERNAME"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "JWT_PRIVATE_KEY_BASE64=$JWT_PRIVATE_KEY_BASE64"
            echo "JWT_PUBLIC_KEY_BASE64=$JWT_PUBLIC_KEY_BASE64"
          } > env.tmp
          scp -F ~/.ssh/config env.tmp target:/opt/pheeeew/.env.new
          ssh -F ~/.ssh/config target 'set -eu; umask 077; cd /opt/pheeeew; [ -f .env ] && cp .env .env.prev && chmod 600 .env.prev || true; chmod 600 .env.new; mv .env.new .env'
          rm -f env.tmp

      - name: 배포
        env:
          IMAGE: ${{ secrets.DOCKERHUB_IMAGE }}:prod-${{ github.sha }}
        run: |
          set -eu
          ssh -F ~/.ssh/config target "APP_IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -eu
          cd /opt/pheeeew

          PREVIOUS=$(docker inspect --format '{{.Config.Image}}' pheeeew-prod-app 2>/dev/null || true)
          echo "이전 이미지: ${PREVIOUS:-없음}"

          wait_healthy() {
            for _ in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' pheeeew-prod-app 2>/dev/null || echo none)
              [ "$status" = healthy ] && return 0
              sleep 5
            done
            return 1
          }

          docker compose -f compose.yml pull app

          started=1
          if ! docker compose -f compose.yml up -d; then
            started=0
            echo "===== 컨테이너 기동 실패 — 상태와 로그 ====="
            docker compose -f compose.yml ps
            docker compose -f compose.yml logs --tail=100
          fi

          if [ "$started" -eq 1 ]; then
            if docker compose -f compose.yml exec -T nginx nginx -t; then
              docker compose -f compose.yml exec -T nginx nginx -s reload
              echo "nginx 설정을 다시 읽었습니다."
            else
              echo "nginx 설정이 올바르지 않아 reload 를 건너뜁니다. 이전 설정으로 계속 동작합니다."
            fi

            if wait_healthy; then
              echo "배포 성공: $APP_IMAGE"
              docker image prune -f
              exit 0
            fi

            echo "===== 헬스체크 실패 — 앱 로그 ====="
            docker compose -f compose.yml logs --tail=100 app
          fi

          if [ -z "$PREVIOUS" ]; then
            echo "롤백할 이전 이미지가 없습니다."
            exit 1
          fi

          echo "===== 롤백: $PREVIOUS ====="
          if [ -f .env.prev ]; then
            echo ".env 도 이전 값으로 되돌립니다."
            cp .env.prev .env
          fi
          APP_IMAGE="$PREVIOUS" docker compose -f compose.yml up -d
          if wait_healthy; then
            echo "롤백 완료. 배포는 실패로 처리합니다."
          else
            echo "롤백도 실패했습니다. 수동 개입이 필요합니다."
          fi
          exit 1
          REMOTE

      - name: Alloy 배포
        run: |
          set -eu
          ssh -F ~/.ssh/config target 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/pheeeew
          chmod 600 .env.alloy
          docker compose --env-file .env.alloy -f compose.monitoring.yml config --quiet
          docker compose --env-file .env.alloy -f compose.monitoring.yml pull alloy
          docker compose --env-file .env.alloy -f compose.monitoring.yml run --rm --no-deps alloy validate /etc/alloy/config.alloy
          docker compose --env-file .env.alloy -f compose.monitoring.yml up -d --force-recreate --wait --wait-timeout 60
          REMOTE

      - name: Alloy 임시 환경 파일 삭제
        if: always()
        run: rm -f "$RUNNER_TEMP/pheeeew-alloy.env"
