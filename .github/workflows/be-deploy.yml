name: BE CD

on:
  push:
    branches:
      - main
    paths:
      - 'BE/**'
      - '.github/workflows/be-deploy.yml'
  workflow_dispatch:
    inputs:
      build_only:
        description: '이미지만 빌드 (운영 배포는 사용자가 적은 시간에 false로 수동 실행)'
        type: boolean
        default: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 이미지 빌드 및 푸시
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: BE
          file: BE/docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_IMAGE }}:prod-${{ github.sha }}
          build-args: |
            APP_RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 운영 서버 배포
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.build_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: S3 Secrets 확인
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_KEY_PREFIX: ${{ secrets.S3_KEY_PREFIX }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          set -eu
          for key in S3_BUCKET S3_KEY_PREFIX S3_REGION; do
            value="${!key:-}"
            if [[ -z "$value" ]]; then
              echo "::error::production Secrets에 $key 값이 등록되어 있지 않거나 비어 있습니다."
              exit 1
            fi
            if [[ ! "$value" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
              echo "::error::production Secrets의 $key 값은 앞뒤 공백 없이 영문, 숫자, 점, 밑줄, 슬래시, 하이픈으로 지정해야 합니다."
              exit 1
            fi
          done

      - name: 무결성 증명 Secrets 확인
        env:
          PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64: ${{ secrets.PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64 }}
          PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ secrets.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
        run: |
          set -eu
          # 운영은 무결성 증명을 강제하므로 자격증명이 비면 앱이 부팅하지 못한다.
          # 부팅 실패와 롤백 대신 여기서 멈춰 원인을 분명히 남긴다.
          if [[ -z "${PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64:-}" ]]; then
            echo "::error::production Secrets에 PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64 값이 등록되어 있지 않거나 비어 있습니다."
            exit 1
          fi
          if [[ ! "${PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::production Secrets의 PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER 값은 숫자여야 합니다."
            exit 1
          fi

      - name: FCM Secrets 확인
        env:
          FCM_SERVICE_ACCOUNT_BASE64: ${{ secrets.FCM_SERVICE_ACCOUNT_BASE64 }}
        run: |
          set -eu
          if [[ -z "${FCM_SERVICE_ACCOUNT_BASE64:-}" ]]; then
            echo "::error::production Secrets에 FCM_SERVICE_ACCOUNT_BASE64 값이 등록되어 있지 않거나 비어 있습니다."
            exit 1
          fi

      - name: cloudflared 설치
        env:
          CLOUDFLARED_VERSION: '2026.8.2'
          CLOUDFLARED_SHA256: 'fcfb02b575a52ca1af2e3267af4e1517bcdeb30ac48c834c69abaed3c0576ad2'
        run: |
          set -eu
          curl -fsSL -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  cloudflared" | sha256sum -c -
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: SSH 설정
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host target
            HostName $SSH_HOST
            User ubuntu
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ID --service-token-secret $CF_SECRET
          CFG
          chmod 600 ~/.ssh/config
          ssh -o ConnectTimeout=30 target 'echo 터널 연결 확인'

      - name: 배포 입력 준비
        id: stage
        env:
          APP_IMAGE: ${{ secrets.DOCKERHUB_IMAGE }}:prod-${{ github.sha }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_PRIVATE_KEY_BASE64: ${{ secrets.JWT_PRIVATE_KEY_BASE64 }}
          JWT_PUBLIC_KEY_BASE64: ${{ secrets.JWT_PUBLIC_KEY_BASE64 }}
          PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64: ${{ secrets.PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64 }}
          PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ secrets.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
          FCM_SERVICE_ACCOUNT_BASE64: ${{ secrets.FCM_SERVICE_ACCOUNT_BASE64 }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_KEY_PREFIX: ${{ secrets.S3_KEY_PREFIX }}
          S3_REGION: ${{ secrets.S3_REGION }}
          COLLECTION_CARD_VERSION: ${{ secrets.COLLECTION_CARD_VERSION }}
        run: |
          set -eu
          umask 077
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          keys = ('APP_IMAGE', 'DB_URL', 'DB_USERNAME', 'DB_PASSWORD', 'JWT_PRIVATE_KEY_BASE64',
                  'JWT_PUBLIC_KEY_BASE64', 'PLAY_INTEGRITY_SERVICE_ACCOUNT_BASE64',
                  'PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER', 'FCM_SERVICE_ACCOUNT_BASE64',
                  'S3_BUCKET', 'S3_KEY_PREFIX', 'S3_REGION', 'COLLECTION_CARD_VERSION')
          Path('env.tmp').write_text(json.dumps({key: os.environ[key] for key in keys}))
          PYTHON
          stage=$(ssh -F ~/.ssh/config target 'umask 077; mktemp -d /opt/pheeeew/.recreate.XXXXXXXX')
          if [[ ! "$stage" =~ ^/opt/pheeeew/\.recreate\.[a-zA-Z0-9]+$ ]]; then
            echo '올바르지 않은 배포 임시 경로입니다.' >&2
            exit 1
          fi
          echo "path=$stage" >> "$GITHUB_OUTPUT"
          scp -F ~/.ssh/config env.tmp "target:$stage/incoming.json"
          for file in press-generation.py compose.prod-bluegreen.yml; do
            scp -F ~/.ssh/config "BE/docker/$file" "target:$stage/$file"
          done

      - name: 운영 단일 앱 교체
        env:
          IMAGE: ${{ secrets.DOCKERHUB_IMAGE }}:prod-${{ github.sha }}
          STAGE: ${{ steps.stage.outputs.path }}
        run: |
          set -eu
          case "$IMAGE" in *[!a-zA-Z0-9._:/@-]*) echo '이미지 이름이 올바르지 않습니다.' >&2; exit 1;; esac
          ssh -F ~/.ssh/config target "python3 - '$STAGE' '$IMAGE'" <<'PYTHON'
          import fcntl
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time
          from uuid import UUID

          sys.dont_write_bytecode = True
          stage, image = Path(sys.argv[1]).resolve(), sys.argv[2]
          spec = importlib.util.spec_from_file_location('generation', stage / 'press-generation.py')
          core = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(core)
          os.umask(0o077)
          os.chdir('/opt/pheeeew')

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def run(args, **kwargs):
              return subprocess.run(args, check=True, capture_output=True, text=True,
                                    pass_fds=(lock.fileno(),), **kwargs).stdout.strip()

          def running_apps():
              return set(run(['docker', 'ps', '--format', '{{.Names}}']).splitlines()) & {
                  'pheeeew-prod-app', 'pheeeew-prod-app-blue', 'pheeeew-prod-app-green'}

          def verify(snapshot):
              inspected = core.container(name)
              require(core.identity(inspected) == snapshot, 'App process changed')
              env = core.environment(inspected)
              require(core.query(env, core.READ_STATE) == database, 'Press control changed')
              require(core.runtime_generation(inspected, required_code='DEVICE_NOT_FOUND') == generation,
                      'App UUID/admission is not ready')
              require(core.probe_generation(env, ['curl', '-q', '--resolve', 'api.pheeeew.com:443:127.0.0.1'],
                          url='https://api.pheeeew.com/api/v1/press-race', required_code='DEVICE_NOT_FOUND') == generation,
                      'HTTPS WebSocket route is not ready')
              require(core.identity(core.container(name)) == snapshot
                      and core.query(env, core.READ_STATE) == database and running_apps() == {name},
                      'App or database changed during verification')

          def sync_directory():
              fd = os.open('.', os.O_RDONLY)
              try:
                  os.fsync(fd)
              finally:
                  os.close(fd)

          try:
              # Existing manual press commands share this OS lock. Never delete its inode.
              with open('.press-operations.lock', 'a') as lock:
                  fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
                  for path in ('.press-operations.lockdir', '.press-deploy.json', '.press-deploy.json.new',
                               '.press-prod-bootstrap.json.new', 'nginx/upstream/active.conf.bak'):
                      require(not os.path.lexists(path), 'Previous operation requires inspection: ' + path)
                  bootstrap = Path('.press-prod-bootstrap.json')
                  if os.path.lexists(bootstrap):
                      require(not bootstrap.is_symlink() and bootstrap.is_file()
                              and json.loads(bootstrap.read_text()).get('phase') == 'FINALIZED',
                              'Previous bootstrap is incomplete or uncertain')
                  pointer = Path('nginx/upstream/active.conf').read_text()
                  match = re.fullmatch(r'\s*set \$upstream_app (app-(?:blue|green));\s*', pointer)
                  require(match is not None, 'Unknown nginx active slot')
                  slot, name = match[1], 'pheeeew-prod-' + match[1]
                  old = core.container(name)
                  require((old['Config'].get('Labels') or {}).get(core.CONTRACT_LABEL) == '2', 'Expected current press contract 2')
                  env = core.environment(old)
                  generation = str(UUID(env[core.GENERATION_KEY]))
                  database = core.query(env, core.READ_STATE)
                  require(database['generation'] == generation, 'App is not the database owner')
                  verify(core.identity(old))
                  incoming = json.loads((stage / 'incoming.json').read_text())
                  require(incoming['DB_URL'] == env['DB_URL'] and incoming['DB_USERNAME'] == env['DB_USERNAME'],
                          'Database URL/user changes need a separate operation')
                  incoming.update(APP_IMAGE=image, PRESS_BLUE_GENERATION=generation, PRESS_GREEN_GENERATION=generation)
                  # Quote dotenv values so credentials are data, not Compose interpolation.
                  for filename, values in (('new.env', incoming), ('previous.env', dict(env, APP_IMAGE=old['Image']))):
                      require(all(isinstance(value, str) and not any(c in value for c in "\n\r\0'\\")
                                  for value in values.values()), 'Unsupported dotenv character')
                      (stage / filename).write_text(''.join(f"{key}='{value}'\n" for key, value in values.items()))
                  process_env = dict(os.environ, COMPOSE_PROFILES='')
                  for key in re.findall(r'\$\{([A-Z_][A-Z0-9_]*)', (stage / 'compose.prod-bluegreen.yml').read_text()):
                      process_env.pop(key, None)
                  compose = ['docker', 'compose', '--project-name', 'pheeeew-prod', '--project-directory', str(Path.cwd()),
                             '--env-file', str(stage / 'new.env'), '-f', str(stage / 'compose.prod-bluegreen.yml'),
                             '--profile', slot.removeprefix('app-')]
                  run(compose + ['config', '--quiet'], env=process_env)
                  run(['docker', 'pull', image], timeout=240)
                  target = json.loads(run(['docker', 'image', 'inspect', image]))[0]
                  require(target['Config']['Labels'].get(core.CONTRACT_LABEL) == '2', 'Expected press contract 2')
                  require(Path('nginx/upstream/active.conf').read_text() == pointer, 'Nginx pointer changed')
                  verify(core.identity(old))
                  # A single interruption record, without a transition state machine or automatic rollback.
                  with open('.press-deploy.json', 'x') as record:
                      json.dump({'slot': slot, 'generation': generation, 'previous_image': old['Image'],
                                 'image': image, 'stage': str(stage)}, record)
                      record.flush()
                      os.fsync(record.fileno())
                  sync_directory()
                  print('Stopping current app before starting replacement.', flush=True)
                  require(core.identity(core.container(name)) == core.identity(old), 'Original process changed before stop')
                  run(['docker', 'stop', '--time', '30', old['Id']], timeout=45)
                  require(not core.container(old['Id'], require_running=False)['State']['Running'], 'Old app did not stop')
                  run(['docker', 'rm', old['Id']], timeout=15)
                  names = run(['docker', 'ps', '--all', '--format', '{{.Names}}']).splitlines()
                  require(name not in names and not running_apps(), 'An app remains after removal')
                  drain_sql = 'BEGIN;\n' + core.READ_STATE.replace('WHERE id = TRUE;', 'WHERE id = TRUE FOR UPDATE;') + '\nCOMMIT;'
                  require(core.query(env, drain_sql) == database, 'Database changed while stopping app')
                  run(compose + ['up', '-d', '--no-deps', '--force-recreate', slot], env=process_env, timeout=240)
                  deadline = time.monotonic() + 180
                  while time.monotonic() < deadline:
                      candidate = core.container(name, require_running=False)
                      require(candidate['Image'] == target['Id'], 'Unexpected app image')
                      if candidate['State'].get('Health', {}).get('Status') == 'healthy':
                          verify(core.identity(candidate))
                          break
                      time.sleep(5)
                  else:
                      raise ValueError('App did not become healthy within 180 seconds')
                  os.replace(stage / 'new.env', '.env')
                  os.replace(stage / 'compose.prod-bluegreen.yml', 'compose.yml')
                  Path('.press-deploy.json').unlink()
                  sync_directory()
                  print('Deployment succeeded: ' + image)
          except (ValueError, KeyError, OSError, subprocess.SubprocessError):
              # Exception argv/output and environment files can contain secrets.
              print('Deployment failed. Inspect operation records and staging files; no automatic rollback.', file=sys.stderr)
              sys.exit(1)
          PYTHON

      - name: 성공한 배포 입력 삭제
        env:
          STAGE: ${{ steps.stage.outputs.path }}
        run: ssh -F ~/.ssh/config target "rm -r -- '$STAGE'"

      - name: 러너 임시 환경 파일 삭제
        if: always()
        run: rm -f env.tmp
