name: AN CI

on:
  pull_request:
    branches: [an/dev, develop, main]
    paths:
      - "AN/Pheeeew/**"
      - ".github/workflows/an-ci.yml"
  push:
    branches: [main]
    paths:
      - "AN/Pheeeew/**"
      - ".github/workflows/an-ci.yml"

concurrency:
  group: an-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: AN/Pheeeew

permissions:
  contents: read

jobs:
  ktlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ktlint check
        run: ./gradlew ktlintCheck

      - name: Upload ktlint report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ktlint-report
          path: AN/Pheeeew/**/build/reports/ktlint/

  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit test (shared), Android lint, and assemble debug APK
        run: ./gradlew :shared:testAndroidHostTest :androidApp:lintDebug :androidApp:assembleDebug

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: AN/Pheeeew/shared/build/reports/tests/

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: AN/Pheeeew/androidApp/build/reports/lint-results-debug.html
